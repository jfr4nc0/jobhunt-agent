[project]
name = "jobhunt-agent"
version = "0.1.0"
description = "Self-hosted job discovery, application tracking and browser-assisted workflows for Codex"
requires-python = ">=3.12"
dependencies = [
  "mcp>=1.28,<2",
  "playwright>=1.55,<2",
  "reportlab>=4.2,<5",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2"]

[project.scripts]
jobhunt = "jobhunt.cli:main"
jobhunt-mcp = "jobhunt.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jobhunt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
